spring.application.name=api-gateway
spring.main.web-application-type=REACTIVE

server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# routes to user service
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# routes to order service
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

# routes to file service
spring.cloud.gateway.server.webflux.routes[2].id=file-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://FILE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/files/**

# routes to folder service
spring.cloud.gateway.server.webflux.routes[3].id=folder-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://FOLDER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/folders/**

# routes to auth service
spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/auth/**

# routes to search service
spring.cloud.gateway.server.webflux.routes[5].id=search-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/search/**

# routes to notification service
spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/notifications/**

management.endpoints.web.exposure.include=*
spring.cloud.gateway.actuator.verbose.enabled=true

# Global CORS (this is the ONLY place CORS should be configured)
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations[/**].allowCredentials=true

# Allow larger request bodies (needed for file uploads)
spring.cloud.gateway.server.webflux.httpclient.max-in-memory-size=52428800
spring.http.codecs.max-in-memory-size=52428800