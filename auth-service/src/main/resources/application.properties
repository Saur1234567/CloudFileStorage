# ===============================
# Application Name
# ===============================
spring.application.name=auth-service


# ===============================
# Server Configuration
# ===============================
server.port=8084


# ===============================
# Database Configuration (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root@210
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# JWT Configuration
# ===============================

# Minimum 32 characters secret key
jwt.secret=mysecretkeymysecretkeymysecretkey123456

# 15 minutes
jwt.access-token-expiration=900000

# 7 days
jwt.refresh-token-expiration=604800000


# ===============================
# Eureka Client Configuration
# ===============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# ===============================
# OpenFeign Configuration
# ===============================
spring.cloud.openfeign.enabled=true


# ===============================
# Actuator Configuration
# ===============================
management.endpoints.web.exposure.include=health,info


# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG
logging.level.com.app.auth=DEBUG